name: Publish to npm and MCP Registry

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable release tag (for example v0.2.8)
        required: true
        type: string
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'yuryev89/webexmcp' && (github.event_name == 'workflow_dispatch' || !github.event.release.prerelease)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}
          persist-credentials: false
      - name: Verify published stable release and tag
        uses: actions/github-script@v8
        env:
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        with:
          script: |
            const assert = require('node:assert/strict');
            const tag = process.env.RELEASE_TAG;
            assert(/^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(tag), 'Expected a stable vVERSION tag');
            const { data: release } = await github.rest.repos.getReleaseByTag({ ...context.repo, tag });
            assert(!release.draft && !release.prerelease, 'Release must be published and stable');
            const { execFileSync } = require('node:child_process');
            const checkedOut = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
            const tagged = execFileSync('git', ['rev-parse', `refs/tags/${tag}^{commit}`], { encoding: 'utf8' }).trim();
            assert.equal(checkedOut, tagged, 'Checkout must match the release tag');
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Use npm with trusted publishing support
        run: npm install --global npm@11.12.1
      - name: Validate release version
        run: node scripts/check-release.mjs
        env:
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
          RELEASE_PRERELEASE: 'false'
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Check CLI
        run: node dist/cli.js --help
      - name: Pack and verify publication contents
        run: |
          npm pack --json > "$RUNNER_TEMP/package-info.json"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync, appendFileSync } from 'node:fs';
          const [pkg] = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/package-info.json`, 'utf8'));
          const files = pkg.files.map(file => file.path);
          for (const required of ['package.json', 'README.md', 'dist/cli.js', 'dist/cli.d.ts']) {
            assert(files.includes(required), `Missing ${required}`);
          }
          assert(files.every(path => path.startsWith('dist/') || /^(package\.json|README\.md|LICEN[CS]E(?:\.md)?)$/.test(path)), 'Unexpected package contents');
          assert.match(pkg.filename, /^[a-zA-Z0-9._-]+\.tgz$/);
          appendFileSync(process.env.GITHUB_ENV, `PACKAGE_FILE=${pkg.filename}\n`);
          NODE
      - name: Check whether this version was already published
        id: npm-status
        uses: actions/github-script@v8
        with:
          script: |
            const { isPublished } = require('./scripts/release-automation.cjs');
            const { name, version } = require('./package.json');
            core.setOutput('published', await isPublished(name, version));
      - name: Publish verified tarball with OIDC
        if: steps.npm-status.outputs.published != 'true'
        run: npm publish "$PACKAGE_FILE" --access public --tag latest
      - name: Wait for the published npm package metadata
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          for attempt in {1..12}; do
            if npm view "@yuryev89/webex-mcp@${VERSION}" mcpName --json 2>/dev/null | grep -Fq '"io.github.yuryev89/webex-mcp"'; then
              exit 0
            fi
            echo "Waiting for npm to expose @yuryev89/webex-mcp@${VERSION} (attempt ${attempt}/12)"
            sleep 10
          done
          echo "::error::npm package metadata is not yet available or mcpName is missing"
          exit 1
      - name: Synchronize MCP Registry manifest with release version
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync, writeFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const manifest = JSON.parse(readFileSync('server.json', 'utf8'));
          assert.equal(pkg.mcpName, manifest.name, 'MCP registry name must match npm mcpName');
          assert.equal(manifest.packages.length, 1);
          assert.equal(manifest.packages[0].identifier, pkg.name);
          manifest.version = pkg.version;
          manifest.packages[0].version = pkg.version;
          writeFileSync('server.json', JSON.stringify(manifest, null, 2) + '\n');
          NODE
      - name: Install official MCP Registry publisher
        run: |
          curl --fail --location --silent --show-error "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" --output mcp-publisher.tar.gz
          tar -xzf mcp-publisher.tar.gz mcp-publisher
          chmod +x mcp-publisher
          ./mcp-publisher --help
      - name: Validate MCP Registry manifest
        run: ./mcp-publisher validate server.json
      - name: Authenticate to MCP Registry with GitHub OIDC
        run: ./mcp-publisher login github-oidc
      - name: Publish to official MCP Registry
        run: ./mcp-publisher publish
